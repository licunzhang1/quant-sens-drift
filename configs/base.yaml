# ============================================================================
#  quant-sens main configuration
#  Change things here, not in the code. Every experiment script reads from this.
# ============================================================================

seed: 42

# ------------------------------------------------------------------- data
data:
  source: synth            # synth | rml2018  (external datasets need their own Dataset)
  modulations: [bpsk, qpsk, 8psk, 16qam]
  n_symbols: 128           # symbols per sample
  sps: 4                   # samples per symbol (oversampling factor)
  rolloff: 0.35            # root-raised-cosine roll-off
  n_train: 8000
  n_val: 2000
  n_test: 1200

  # Channel impairments of the reference domain (Domain A)
  #
  # [!] Difficulty must sit in the window where the source domain is not
  #   saturated and the target domain has not collapsed, otherwise the
  #   experiment is meaningless:
  #     - source saturated (loss ~ 0) -> quantization no longer changes the
  #       output -> 7 of 10 layers show zero sensitivity -> rho is noise
  #     - target collapsed to chance -> the sensitivity ranking is itself noise
  #
  # Measured (CLDNN, n_symbols=128 / sps=4):
  #   source (4,12) dB -> acc 0.9995 / loss 0.0013   <- saturated, degenerate
  #   source (-2,6) dB -> acc about 0.89             <- usable
  # So the source domain is set to (-2,6).
  domain_a:
    snr_db: [-2, 6]
    cfo: 0.0
    phase_noise_deg: 0.0
    iq_gain_db: 0.0
    iq_phase_deg: 0.0
    gain_db: 0.0

  # Target domains (Domain B) -- the shift is constructed here.
  # Pick one per run with scripts/run_sensitivity.py --shift NAME
  #
  # [!] On CFO: higher-order cumulants are NOT CFO-invariant
  #   (see finding 3 in docs/findings.md). Measured at the same CFO=0.02:
  #   cumulant features reach target-domain acc 0.31, CLDNN reaches 0.50.
  #   That is itself evidence that "shift strength depends on the
  #   representation", which makes it a useful contrast arm.
  #
  # [!] D3_gain is an INEFFECTIVE shift: every sample is power-normalised, so a
  #   global gain cancels out (measured accuracy drop +0.0005). It is kept as a
  #   NULL CONTROL -- the pipeline should correctly report "no shift".
  shifts:
    D1_snr:        {snr_db: [-8, 0]}                       # SNR interval shift (default target)
    D2_cfo:        {snr_db: [-2, 6], cfo: 0.02}            # carrier frequency offset
    D3_gain:       {snr_db: [-2, 6], gain_db: 6.0}         # null control: should have no effect
    D4_phasenoise: {snr_db: [-2, 6], phase_noise_deg: 3.0}
    D5_iqimb:      {snr_db: [-2, 6], iq_gain_db: 1.5, iq_phase_deg: 5.0}  # IQ imbalance

# ------------------------------------------------------------------ model
# [!] Layer count directly determines the statistical power of the rank
#   analysis. Measured: a single convolution per CLDNN stage gives only 5
#   weight layers, and at n=5 the 95% CI for rho is as wide as [-1, 1].
#   Hence convs_per_stage=2, giving 8 conv + 2 fc = 10 weight layers.
#   The ResNet1D configuration has 16 weight layers. Both backbones clear
#   the >= 10 requirement.
model:
  name: cldnn              # cldnn | resnet1d
  n_classes: 4
  cldnn:
    conv_channels: [64, 64, 128, 128]
    convs_per_stage: 2     # two convolutions per stage (8 conv + 2 fc = 10 layers)
    kernel_size: 8
    dropout: 0.3
    lstm_hidden: 64
    fc_hidden: 128
  resnet1d:
    base_channels: 32
    n_blocks: [2, 2, 2]    # 16 weight layers
    dropout: 0.2

# ----------------------------------------------------------------- training
train:
  epochs: 40
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine
  early_stop_patience: 8
  device: auto             # auto | cpu | cuda

# -------------------------------------------------------------- quantization
quant:
  bits_ladder: [2, 3, 4, 6, 8]   # bit-width ladder
  reference_bits: 4              # reference bit-width used to measure sensitivity
  symmetric: true
  per_channel_weights: true      # weights default to per-channel
  per_channel_activations: false # activations are normally per-tensor
  include_activations: true      # false = weight-only quantization

# -------------------------------------------------------- sensitivity analysis
sensitivity:
  # [!] The primary metric must be loss, never accuracy.
  #   Accuracy saturates: once in-domain accuracy is 1.0, quantizing a layer to
  #   2 bit can still leave it at 1.0, so delta-accuracy is identically zero and
  #   the rank correlation degenerates to NaN.
  #   (Measured: see the accuracy-metric contrast in tests/smoke_pipeline.py.)
  metric: loss             # loss | acc
  # To keep the experiment small, sensitivity can be measured on a subset of
  # layers (regex matched against module names)
  layer_filter: null       # null = all quantizable layers; or e.g. "conv|fc"
  max_layers: null         # null = no limit; integer = first N layers (debug only)

# --------------------------------------------------------- rank stability
rank:
  n_permutations: 10000    # permutations for the permutation test
  alpha: 0.05

# ------------------------------------------------- equal reconstruction error arm
equal_error:
  total_bit_budget: 0.8    # fraction of (n_layers x max bit-width)
  weight_by_params: true   # weight the budget by parameter count

# ------------------------------------------------------------------- output
output:
  root: results
  save_npz: true
  save_csv: true
